name: Internal docs guard

# This repository is PUBLIC. This job is a safety net against internal material
# reaching it — it scans only the files a PR or push actually changes, and fails
# loudly rather than silently.
#
# It is deliberately narrow: it looks for explicit internal markers and for
# marketplace-economics vocabulary that has no reason to appear in a provider
# client. It will not catch everything, and it is not a substitute for the
# judgement documented in CLAUDE.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    # Defined once at job level: a second copy in the metadata step below would
    # drift, and the half that stopped matching would be the half nobody notices.
    env:
      MARKERS: 'Internal — not for external distribution|Internal - not for external distribution|not for external distribution|CONFIDENTIAL|Confidential — |INTERNAL ONLY|Internal only, do not distribute'
      ECONOMICS: 'subscription pool|pool settlement|projected (settlement )?ratio|payout ratio|platform margin|gross margin|competitive landscape|competitor analysis'
      VERIFICATION: 'logprob_sample_rate|sampling rate of [0-9]|detection threshold|probe selection|which requests are probes'
      CROSSREPO: '(swanchain/)?swan-inference#[0-9]+'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # First push to a new branch, or an unknown base: fall back to the
            # previous commit rather than scanning the whole repository.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="${head}~1"
            fi
          fi
          git diff --name-only --diff-filter=ACMR "$base" "$head" > changed.txt || git ls-files > changed.txt
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; cat changed.txt

      - name: Scan for internal markers
        run: |
          set -uo pipefail
          fail=0

          # Explicit markers. These are unambiguous: a document that says it is
          # internal must not be in a public repository.
          markers="$MARKERS"

          # Marketplace economics and verification internals. A provider client
          # has no reason to discuss these; the marketplace repo does.
          economics="$ECONOMICS"
          verification="$VERIFICATION"
          # Links into the private tracker: they resolve for nobody outside the
          # org, yet still disclose the issue number and the work behind it.
          crossrepo="$CROSSREPO"

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              .github/workflows/internal-docs-guard.yaml|CLAUDE.md) continue ;;
            esac

            if grep -nEi "$markers" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Contains an explicit internal-only marker. This repository is PUBLIC — move it to the private swan-inference repo."
              grep -nEi "$markers" "$f" | head -3 | sed 's/^/    /'
              fail=1
            fi

            if grep -nEi "$economics" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Mentions marketplace economics, which belong in the private swan-inference repo, not the public provider client."
              grep -nEi "$economics" "$f" | head -3 | sed 's/^/    /'
              fail=1
            fi

            if grep -nE "$crossrepo" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Links to an issue in the private swan-inference repo. Describe the finding in its own words instead."
              grep -nE "$crossrepo" "$f" | head -3 | sed 's/^/    /'
              fail=1
            fi

            if grep -nEi "$verification" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Mentions verification internals. Publishing sampling rates or thresholds tells a dishonest provider how to stay under them."
              grep -nEi "$verification" "$f" | head -3 | sed 's/^/    /'
              fail=1
            fi
          done < changed.txt

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "See the '⚠️ This repository is PUBLIC' section of CLAUDE.md."
            echo "If a match is a false positive, adjust the pattern in this workflow"
            echo "in the same PR and say why in the description."
            exit 1
          fi
          echo "No internal material detected in the changed files."

      # Files are only half the surface. All three leaks this repo has had
      # reached GitHub through a commit message or a PR description, each while
      # the file scan above passed — the material never appeared in a diff.
      #
      # PR titles and bodies are written by anyone who can open a PR, so they
      # are passed in through env and quoted, never interpolated into the shell.
      # `${{ github.event.pull_request.body }}` inlined into a run: block is a
      # command-injection hole, not a style preference.
      - name: Scan commit messages and PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          fail=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="${head}~1"
            fi
          fi

          # Only the commits this change introduces. Scanning all of history
          # would fail every PR over material that is already public and cannot
          # be unpublished by failing a build.
          git log --format='%H%n%B%n---COMMIT---' "$base..$head" > messages.txt 2>/dev/null || : > messages.txt

          check() {
            # $1 = what is being scanned, $2 = pattern, $3 = message, $4 = file
            if grep -nEi "$2" "$4" >/dev/null 2>&1; then
              echo "::error::$1: $3"
              grep -nEi "$2" "$4" | head -3 | sed 's/^/    /'
              fail=1
            fi
          }

          if [ -s messages.txt ]; then
            echo "Scanning $(grep -c -- '---COMMIT---' messages.txt) commit message(s)."
            check "commit message" "$CROSSREPO" "Links to an issue in the private swan-inference repo. Reword the commit and force-push — once merged this is permanent." messages.txt
            check "commit message" "$MARKERS" "Contains an explicit internal-only marker." messages.txt
            check "commit message" "$ECONOMICS" "Mentions marketplace economics." messages.txt
            check "commit message" "$VERIFICATION" "Mentions verification internals." messages.txt
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > prmeta.txt
            check "PR title/description" "$CROSSREPO" "Links to an issue in the private swan-inference repo. Describe the finding in its own words instead." prmeta.txt
            check "PR title/description" "$MARKERS" "Contains an explicit internal-only marker." prmeta.txt
            check "PR title/description" "$ECONOMICS" "Mentions marketplace economics." prmeta.txt
            check "PR title/description" "$VERIFICATION" "Mentions verification internals." prmeta.txt
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "See the '⚠️ This repository is PUBLIC' section of CLAUDE.md."
            echo "A commit message can be fixed with an interactive rebase and a"
            echo "force-push; a PR description can be edited in place. Both are"
            echo "cheap now and impossible after merge."
            exit 1
          fi
          echo "No internal material detected in commit messages or PR metadata."
